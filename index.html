<style>
:root{

  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1826; --surface:#10243A; --ink:#E4F0F8; --muted:#8FA6BA;
  --line:#1E3A55; --row:#132B44;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
header{padding:28px 20px 8px;max-width:1200px;margin:0 auto;border-left:10px solid var(--sky)}
h1{font:800 clamp(34px,7vw,64px)/.95 var(--cond);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0}
.controls{max-width:1200px;margin:18px auto 12px;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:600 15px var(--cond);padding:7px 16px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{min-width:160px}
.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--sky)}
details{position:relative}
summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
summary::-webkit-details-marker{display:none}
.picker{position:absolute;z-index:5;top:110%;left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  width:min(90vw,420px);max-height:60vh;overflow:auto;columns:2;gap:14px;box-shadow:0 12px 30px rgba(10,24,38,.18)}
.picker label{display:block;break-inside:avoid;padding:3px 0;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto 40px;padding:0 20px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:600 15px var(--cond);position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th.sorted{box-shadow:inset 0 -3px 0 var(--sky)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
tbody tr{background:var(--surface)}
tbody tr:nth-child(even){background:var(--row)}
td.name b{display:block;font-weight:600}
td.name span{color:var(--muted);font-size:13px}
td.lead{color:var(--star);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,th:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style>
</head>

:"F"},"7588":{"c":"EVE","n":"Merlin R\u00f6hl","o":"FA","p":"M"},"7590":{"c":"AVL","n":"Johan Manzambi","o":"Sleeper Blows BBC","p":"M"},"7723":{"c":"LEE","n":"Lukas Nmecha","o":"FA","p":"F"},"7735":{"c":"LEE","n":"Jean-Matt\u00e9o Bahoya","o":"FA","p":"F"},"7755":{"c":"COV","n":"Aur\u00e8le Amenda","o":"FA","p":"D"},"7756":{"c":"FUL","n":"Hugo Larsson","o":"FA","p":"M"},"7845":{"c":"NFO","n":"Luca Netz","o":"FA","p":"D"},"7858":{"c":"LEE","n":"Nico Elvedi","o":"FA","p":"D"},"7906":{"c":"CRY","n":"Honest Ahanor","o":"FA","p":"D"},"7919":{"c":"HUL","n":"Brooke Norton-Cuffy","o":"FA","p":"D"},"7986":{"c":"BHA","n":"Michael Svoboda","o":"FA","p":"D"},"7993":{"c":"AVL","n":"Zion Suzuki","o":"Elite FC","p":"GK"},"8273":{"c":"COV","n":"Loum Tchaouna","o":"FA","p":"F"},"8306":{"c":"LEE","n":"Jaka Bijol","o":"FA","p":"D"},"8339":{"c":"MCI","n":"Rayan Cherki","o":"Chicago United","p":"M"},"8340":{"c":"SUN","n":"Malick Fofana","o":"FA","p":"F"},"8358":{"c":"EVE","n":"Ainsley Maitland-Niles","o":"FA","p":"M"},"8398":{"c":"HUL","n":"Robinio Vaz","o":"FA","p":"F"},"8560":{"c":"SUN","n":"Dayann M\u00e9thalie","o":"FA","p":"D"},"8563":{"c":"CRY","n":"Jaydee Canvot","o":"FA","p":"D"},"8577":{"c":"IPS","n":"Abdoul Ouattara","o":"FA","p":"D"},"8599":{"c":"SUN","n":"Habib Diarra","o":"FA","p":"M"},"8614":{"c":"HUL","n":"Sorba Thomas","o":"FA","p":"F"},"8633":{"c":"COV","n":"Sidiki Cherif","o":"FA","p":"F"},"8696":{"c":"HUL","n":"Mohamed-Ali Cho","o":"FA","p":"F"},"8701":{"c":"CRY","n":"Evann Guessand","o":"FA","p":"F"},"8703":{"c":"LEE","n":"Melvin Bard","o":"FA","p":"D"},"8738":{"c":"BOU","n":"Adrien Truffert","o":"DieginhoFc","p":"D"},"8744":{"c":"LIV","n":"J\u00e9r\u00e9my Jacquet","o":"Game of Cojones","p":"D"},"8748":{"c":"NFO","n":"Arnaud Kalimuendo","o":"FA","p":"F"},"8872":{"c":"MUN","n":"Shea Lacey","o":"FA","p":"F"},"9108":{"c":"NFO","n":"Jair Cunha","o":"FA","p":"D"},"9139":{"c":"NFO","n":"Igor Jesus","o":"FA","p":"F"},"9438":{"c":"CHE","n":" Est\u00eav\u00e3o","o":"Game of Gambling Chapins","p":"F"},"9599":{"c":"BHA","n":"Luka Vuskovic","o":"Game of Cojones","p":"D"}},"positions":["D","DEF","F","GK","M"],"unnamedClubs":[]};
const VIEWS = {
  players: {keys:D.keys, labels:D.labels, name:"Player"},
  fantasy: {keys:D.keys, labels:D.labels, name:"Fantasy team"},
  clubs:   {keys:D.clubKeys, labels:D.clubLabels, name:"Club"},
};
const S = {
  view:"players", mode:"season", leg:String(D.lastLeg), per:false, owner:"", pos:"", q:"", dir:-1,
  cols:{players:[...D.defaults], fantasy:[...D.defaults], clubs:[...D.clubDefaults]},
  sort:{players:D.defaults[0]||"name", fantasy:D.defaults[0]||"name", clubs:D.clubDefaults[0]||"name"},
};
const $ = id => document.getElementById(id);

function fill(sel, items){ items.forEach(v=>{const o=document.createElement("option");o.value=o.textContent=v;sel.appendChild(o);}); }
fill($("owner"), D.owners); fill($("pos"), D.positions);
for(let l=D.lastLeg;l>=1;l--){const o=document.createElement("option");o.value=l;o.textContent="Leg "+l;$("leg").appendChild(o);}

function buildPicker(){
  const V=VIEWS[S.view], cols=S.cols[S.view];
  $("picker").innerHTML = V.keys.length ? "" : "<p>No stats for this view yet.</p>";
  V.keys.forEach(k=>{
    const lab=document.createElement("label");
    lab.innerHTML=`<input type="checkbox" value="${k}" ${cols.includes(k)?"checked":""}> ${V.labels[k]}`;
    $("picker").appendChild(lab);
  });
}
$("picker").addEventListener("change",e=>{
  const k=e.target.value, V=VIEWS[S.view], cols=S.cols[S.view];
  S.cols[S.view] = e.target.checked ? V.keys.filter(x=>cols.includes(x)||x===k) : cols.filter(x=>x!==k);
  if(!S.cols[S.view].includes(S.sort[S.view])) S.sort[S.view] = S.cols[S.view][0]||"name";
  render();
});

document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  S.view=b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  ["owner","pos","q"].forEach(id=>$(id).hidden = S.view!=="players");
  $("q").placeholder = "Find a player";
  buildPicker(); render();
});
function setMode(m){
  S.mode=m; $("mSeason").setAttribute("aria-pressed",m==="season"); $("mLeg").setAttribute("aria-pressed",m==="leg");
  $("leg").hidden = m!=="leg"; render();
}
$("mSeason").onclick=()=>setMode("season"); $("mLeg").onclick=()=>setMode("leg");
$("leg").onchange=e=>{S.leg=e.target.value;render();};
$("per").onchange=e=>{S.per=e.target.checked;render();};
$("owner").onchange=e=>{S.owner=e.target.value;render();};
$("pos").onchange=e=>{S.pos=e.target.value;render();};
$("q").oninput=e=>{S.q=e.target.value.toLowerCase();render();};

function rows(){
  const legIds = S.mode==="season" ? Object.keys(D.legs) : [S.leg];
  const acc = {};
  const add = (id, stats, countMatch=true) => {
    const a = acc[id] || (acc[id] = {v:{}, n:0});
    if(countMatch) a.n++;
    for(const k in stats) a.v[k] = (a.v[k]||0) + stats[k];
  };
  legIds.forEach(l=>{
    if(S.view==="clubs"){ const L=D.clubLegs[l]||{}; for(const c in L) add(c, L[c]); return; }
    const L=D.legs[l]||{}, counted={};
    for(const pid in L){
      if(S.view==="players"){ add(pid, L[pid]); continue; }
      const o=D.players[pid].o; if(o==="FA") continue;
      add(o, L[pid], !counted[o]); counted[o]=1;
    }
  });
  let rs = Object.entries(acc).map(([id,a])=>{
    const v = S.per ? Object.fromEntries(Object.entries(a.v).map(([k,x])=>[k, x/a.n])) : a.v;
    if(S.view==="players"){ const p=D.players[id]; return {name:p.n, sub:`${p.p} ${p.c} · ${p.o}`, o:p.o, p:p.p, v}; }
    return {name:id, sub:`${a.n} ${a.n===1?"match":"matches"}`, v};
  });
  if(S.view==="players") rs = rs.filter(r=>(!S.owner||r.o===S.owner)&&(!S.pos||r.p===S.pos)&&(!S.q||r.name.toLowerCase().includes(S.q)));
  return rs;
}
const fmt = x => x==null ? "–" : (Number.isInteger(x) ? x : x.toFixed(2));

function render(){
  const V=VIEWS[S.view], cols=S.cols[S.view], sort=S.sort[S.view];
  const range = S.mode==="season" ? `through leg ${D.lastLeg}` : `in leg ${S.leg}`;
  $("sub").textContent = `${{players:"Player",fantasy:"Fantasy team",clubs:"Club"}[S.view]} ${S.per?"per-match averages":"totals"} ${range}`;
  let rs = rows();
  rs.sort((a,b)=> sort==="name" ? -S.dir*a.name.localeCompare(b.name) : S.dir*((a.v[sort]||0)-(b.v[sort]||0)));
  const head = [["name",V.name],...cols.map(k=>[k,V.labels[k]])];
  $("thead").innerHTML = "<tr>"+head.map(([k,l])=>`<th tabindex="0" data-k="${k}" class="${k===sort?"sorted":""}" aria-sort="${k===sort?(S.dir<0?"descending":"ascending"):"none"}">${l}</th>`).join("")+"</tr>";
  const max={}; cols.forEach(k=>max[k]=Math.max(0,...rs.map(r=>r.v[k]||0)));
  $("tbody").innerHTML = rs.length ? rs.map(r=>`<tr><td class="name"><b>${r.name}</b><span>${r.sub}</span></td>`+
    cols.map(k=>`<td class="${max[k]>0&&r.v[k]===max[k]?"lead":""}">${fmt(r.v[k])}</td>`).join("")+"</tr>").join("")
    : `<tr><td class="empty" colspan="${head.length}">Nothing matches these filters. Clear a filter or pick another leg.</td></tr>`;
}
$("thead").addEventListener("click",e=>{const k=e.target.dataset.k;if(!k)return;S.dir = S.sort[S.view]===k ? -S.dir : -1;S.sort[S.view]=k;render();});
$("thead").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.click();});
buildPicker(); render();
</script>
